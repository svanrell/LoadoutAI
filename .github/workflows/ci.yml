name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # El binario de Electron (~100 MB) solo hace falta para empaquetar, no para compilar ni testear
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend (tsc, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # npm test incluye el test de paridad Node ↔ Python, que ejecuta el predictor
      # de Python (solo usa la librería estándar). En CI falla si no hay Python.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

  python:
    name: Python (predictor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # El CLI devuelve código 0 también cuando falla (imprime success: false),
      # así que se comprueba el JSON de salida
      - name: Predictor con un draft de ejemplo
        run: |
          python src/machine_learning/predict.py --map Bind --mode competitive \
            --allies jett,omen,sova --enemies raze,killjoy > prediction.json
          python - <<'EOF'
          import json
          result = json.load(open("prediction.json"))
          assert result["success"], result
          assert result["recommendations"], "El predictor no devolvió recomendaciones"
          top = ", ".join(r["displayName"] for r in result["recommendations"][:3])
          print(f"Sinergia actual: {result['currentSynergy']} | Recomendados: {top}")
          EOF

      # Entrena con los datos versionados y así usa de verdad pandas, numpy, scikit-learn
      # y joblib de requirements.txt. Cualquier error del entrenamiento termina Python con
      # código distinto de 0 y el paso falla. Va después del predictor para que este pruebe
      # el draft_data.json versionado; que el entrenamiento lo regenere aquí no importa.
      - name: Entrenamiento
        run: python src/machine_learning/pregame/model.py
